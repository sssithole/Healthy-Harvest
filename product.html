<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — Blossom-Hai</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="./index.html" class="logo">Blossom-Hai</a>
        <div class="cart-icon" id="cartIcon">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb-bar">
        <div class="breadcrumb-inner">
            <a href="./index.html">Home</a>
            <span class="breadcrumb-sep">›</span>
            <span id="breadcrumbTitle">Product</span>
        </div>
    </div>

    <!-- Product Detail -->
    <div class="product-page">
        <!-- Not-found state (hidden until needed) -->
        <div class="product-not-found" id="productNotFound" style="display:none;">
            <div class="not-found-icon">🌿</div>
            <h2>Product Not Found</h2>
            <p>This product may have been removed or is no longer available.</p>
            <a href="./index.html" class="add-to-cart">Back to Shop</a>
        </div>

        <!-- Product content (visible by default, hidden if product missing) -->
        <div class="product-container" id="productContainer">
            <!-- Image panel -->
            <div class="product-image">
                <img id="productImage" src="" alt="" />
            </div>

            <!-- Details panel -->
            <div class="product-details">
                <h1 class="product-title" id="productTitle">Loading…</h1>
                <div class="product-price" id="productPrice"></div>
                <p class="product-description" id="productDescription"></p>

                <div class="benefits-section" id="benefitsSection">
                    <h3 class="benefits-title">Health Benefits:</h3>
                    <ul class="benefits-list" id="benefitsList">
                        <!-- Populated by loadProduct() in script.js -->
                    </ul>
                </div>

                <button class="add-to-cart" id="addToCart">Add to Cart</button>
                <a href="./index.html" class="back-link">← Continue Shopping</a>
            </div>
        </div>
    </div>

    <!-- Scripts: products store must load before script.js -->
    <script src="./products.js"></script>
    <script src="./script.js"></script>
    <script>
        // Read ?id= from URL and render the product
        (function () {
            const params    = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            const container = document.getElementById('productContainer');
            const notFound  = document.getElementById('productNotFound');

            if (!productId || !getProductById(productId)) {
                container.style.display = 'none';
                notFound.style.display  = 'block';
                document.title = 'Product Not Found — Blossom-Hai';
                return;
            }

            // Set data-product-id so script.js DOMContentLoaded picks it up
            document.body.setAttribute('data-product-id', productId);

            // Update breadcrumb once product is known
            const product = getProductById(productId);
            const bc = document.getElementById('breadcrumbTitle');
            if (bc) bc.textContent = product.title;
        })();
    </script>
</body>
</html>
